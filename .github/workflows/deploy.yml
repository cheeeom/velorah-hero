name: Deploy to GitHub Pages

# 推送到 main 即自动构建并发布到 gh-pages 分支
# 说明：沿用现有 Pages 配置（从 gh-pages 分支发布），无需改仓库设置
on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html 缺失，构建产物异常"; exit 1; }
          test -f dist/bg-poster.jpg && echo "✅ 海报存在" || echo "⚠️ 未找到海报，不影响发布"
          du -sh dist

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.event.head_commit.message || 'manual deploy' }}"
